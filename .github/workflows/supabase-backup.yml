name: Automated Supabase Backup to Cloudflare R2

on:
  schedule:
    # Runs everyday at 2:30 AM UTC
    - cron: '30 2 * * *'
  # Allows you to manually trigger the backup from the GitHub Actions UI tab
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install PostgreSQL Client
      run: |
        # Ubuntu 24.04 only ships Postgres 16. Supabase is 17, and pg_dump
        # refuses to dump a newer server. Client 17 comes from PGDG.
        sudo apt-get update
        sudo apt-get install -y postgresql-common ca-certificates
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-17
        echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
        /usr/lib/postgresql/17/bin/pg_dump --version

    - name: Run pg_dump and Compress Backup
      run: |
        # The runner's shell is `bash -e` without pipefail, so a failing
        # pg_dump in `pg_dump | gzip` still exits 0 and uploads an empty archive.
        set -o pipefail

        # Generates a timestamped filename (e.g., supabase_backup_20261021_233900.sql.gz)
        FILENAME="supabase_backup_$(date +'%Y%m%d_%H%M%S').sql.gz"
        echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

        # SUPABASE_DB_HOST must be the session pooler (IPv4), not
        # db.<project-ref>.supabase.co. That direct host is IPv6-only, and
        # GitHub-hosted runners have no route to it. User is postgres.<project-ref>.
        # Port 6543 is transaction mode and cannot run pg_dump.
        PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" pg_dump \
          -h "${{ secrets.SUPABASE_DB_HOST }}" \
          -U "${{ secrets.SUPABASE_DB_USER }}" \
          -p 5432 \
          -d postgres \
          -v | gzip > "$FILENAME"

        # An empty stream compresses to a 20-byte gzip. Refuse to continue.
        if [ "$(stat -c%s "$FILENAME")" -le 20 ]; then
          echo "pg_dump produced an empty archive" >&2
          exit 1
        fi

    - name: Upload Backup to Cloudflare R2 Bucket
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        # Current AWS CLI sends a CRC64 checksum R2 rejects as Access Denied.
        AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      run: |
        # R2 is not AWS STS. Passing region "auto" to the AWS login action
        # looks up sts.auto.amazonaws.com, which does not exist.
        aws s3 cp "$FILENAME" "s3://${{ secrets.R2_BUCKET_NAME }}/$FILENAME" \
          --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}" \
          --region auto \
          --checksum-algorithm CRC32

        echo "Successfully uploaded $FILENAME to Cloudflare R2."
